# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- master

pool:
  name: Default
  vmImage: ubuntu-latest

stages:
# Stage 1: Chạy bình thường
  - stage: StageA
    displayName: "Stage A"
    jobs:
    - job: JobA
      steps:
      - script: echo "Stage A done"

  # Stage 2 và 3 cùng dependsOn StageA - chạy song song
  # Stage 2: Cần approval (simulate DeployClusterK8S)
  - stage: StageB_NeedApproval
    displayName: "Stage B - Need Approval"
    dependsOn: StageA
    # Tạo environment "staging" có approval gate trong Azure DevOps UI
    jobs:
    - deployment: DeployB
      environment: prod   # ← environment này có approval gate
      strategy:
        runOnce:
          deploy:
            steps:
            - script: echo "Stage B done"

  # Stage 3: Không cần approval (simulate DeployProd)
  - stage: StageC_NeedApproval
    displayName: "Stage C - No Approval"
    dependsOn: StageA
    jobs:
    - job: JobC
      steps:
      - script: echo "Stage C done"

  # ===== 2 stage dưới bị block dù StageC xong =====

  # Stage 4 (simulate DeployClusterDR)
  - stage: StageD
    displayName: "Stage D - Bị Block"
    dependsOn: StageC_NeedApproval
    condition: succeeded()   # ← bị block vì succeeded() check tất cả stage
    jobs:
    - job: JobD
      steps:
      - script: echo "Stage D done"

  # Stage 5 (simulate SendNotify)  
  - stage: StageE
    displayName: "Stage E - Bị Block"
    dependsOn: StageC_NeedApproval
    condition: succeeded()   # ← bị block vì succeeded() check tất cả stage
    jobs:
    - job: JobE
      steps:
      - script: echo "Stage E done"