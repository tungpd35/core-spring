# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- master

pool:
  name: Default
  vmImage: ubuntu-latest

stages:
  # Stage 1: Simulate DeployUat
  - stage: DeployUat
    displayName: "Deploy UAT Stage"
    jobs:
      - job: DeployUatJob
        steps:
          - script: echo "Deploying to UAT..."

  # Stage 2: DeployClusterK8S - dependsOn DeployUat (có approval gate)
  # BUG: Dù DeployProd xong, stage này vẫn Waiting vì approval gate trên environment
  - stage: DeployClusterK8S
    displayName: "Deploy Cluster K8S Stage"
    dependsOn: DeployUat
    condition: |
            and(
              succeeded(),
              startsWith(variables['Build.SourceBranch'], 'refs/heads/master')
            )
    jobs:
      - deployment: DockerBuild
        environment: prod          # ← Approval gate được gắn ở đây trong Azure DevOps portal
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "DockerBuild..."
      - deployment: DeployK8S2
        environment: prod          # ← Approval gate được gắn ở đây trong Azure DevOps portal
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploying2 to K8S cluster..."

  # Stage 3: DeployProd - dependsOn DeployUat (chạy song song với DeployClusterK8S)
  - stage: DeployProd
    displayName: "Deploy Prod Stage"
    dependsOn: DeployUat
    condition: |
            and(
              succeeded(),
              startsWith(variables['Build.SourceBranch'], 'refs/heads/master')
            )
    jobs:
      - deployment: DeployProdJob
        environment: prod          # ← Cùng environment, cùng approval gate.
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploying to Prod..."

  # Stage 4: DeployClusterDR - dependsOn DeployProd
  # BUG: Not started dù DeployProd đã xong vì DeployClusterK8S vẫn đang Waiting
  - stage: DeployClusterDR
    displayName: "Deploy DR Stage"
    dependsOn: DeployProd
    condition: |
            and(
              succeeded(),
              startsWith(variables['Build.SourceBranch'], 'refs/heads/master')
            )
    jobs:
      - deployment: DeployDR
        environment: dr
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploying to DR..."

  # Stage 5: SendNotify - dependsOn DeployProd
  # BUG: Tương tự, Not started
  - stage: SendNotify
    displayName: "Create PR Task"
    dependsOn: DeployProd
    condition: |
            and(
              succeeded(),
              startsWith(variables['Build.SourceBranch'], 'refs/heads/master')
            )
    jobs:
      - deployment: DeployDR
        environment: notify
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Sending notification..."