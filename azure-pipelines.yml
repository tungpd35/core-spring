# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- master

pool:
  name: Default
  vmImage: ubuntu-latest

stages:
- stage: "BuildProject"
  displayName: "Build Project"
  jobs:
  - job: Build
    steps:
    - script: |
        echo "Move to core-service"
        cd core-service
        pwd
        docker build . -t core-service:v1
      displayName: "Build Project"
- stage: 
  displayName: "Scan Project"
  jobs:
    - deployment: 
      environment: dev
      displayName: "Scan code with gitleaks"
      strategy:
        runOnce:
          deploy:
            steps:
            - task: Gitleaks@3
              name: scan
              inputs:
                scanlocation: '$(Build.SourcesDirectory)/core-service'
                configtype: 'predefined'
                predefinedconfigfile: 'GitleaksUdmCombo.toml'
                reportformat: 'sarif'
                scanmode: 'directory'
              displayName: "Scan for password or hardcode"
              continueOnError: true
- stage: 
  displayName: "Scan Image"
  jobs:
    - deployment: 
      environment: dev
      displayName: "Scan image with trivy"
      strategy:
        runOnce:
          deploy:
            steps:
              - script: |
                  curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh ./bin/trivy image maven:3.9.14-eclipse-temurin-17
                displayName: "Scan Docker Image"

- stage: 
  jobs:
    - deployment: 
      environment: wait
      displayName: "Wait for approving"
      strategy:
        runOnce:
          deploy:
            steps:
            - script: |
                 echo Wait for Leader approving    
              displayName: Wait for Leader approving pipeline