# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- master

pool:
  name: Default
  vmImage: ubuntu-latest

stages:
- stage: Init
  jobs:
  - job: init
    steps:
    - script: echo "Init"

# 2. Stage trung gian (rất quan trọng)
- stage: AfterInit
  dependsOn: Init
  jobs:
  - job: mid
    steps:
    - script: echo "After Init"

# 3. Tách nhánh từ cùng 1 node trung gian
- stage: BuildA
  dependsOn: AfterInit
  jobs:
  - job: buildA
    steps:
    - script: echo "Build A done"

- stage: BuildB
  dependsOn: AfterInit
  jobs:
  - deployment: waitJob
    environment: wait   # có approval → WAITING
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo "Waiting approval..."

# 4. Stage cuối (giống SendNotify)
- stage: FinalStage
  dependsOn: BuildA
  condition: succeeded()
  jobs:
  - job: final
    steps:
    - script: echo "Final running"