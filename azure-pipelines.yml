trigger:
- master

pool:
  name: Default
  vmImage: ubuntu-latest

stages:
- stage: "BuildProject"
  displayName: "Build Project"
  jobs:
  - job: Build
    steps:
    - script: |
        echo "Move to core-service"
        cd core-service
        pwd
        docker build . -t core-service:v1
      displayName: "Build Project"
- stage: 
  jobs:
    - deployment: 
      environment: ${{ parameters.environment }}
      displayName: "Wait for approving"
      strategy:
        runOnce:
          deploy:
            steps:
            - script: |
                 echo Wait for Leader approving    
              displayName: Wait for Leader approving pipeline