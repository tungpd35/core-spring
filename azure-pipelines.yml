# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- master

pool:
  name: Default
  vmImage: ubuntu-latest

stages:
# Stage 1: Chạy bình thường
  - stage: StageA
    displayName: "Stage A"
    jobs:
    - job: JobA
      steps:
      - script: echo "Stage A done"

  # Simulate DeployClusterK8S - có approval, chạy song song với StageC
  - stage: StageB_NeedApproval
    displayName: "Stage B - Need Approval"
    dependsOn: StageA
    jobs:
    - deployment: DeployB
      environment: prod   # environment có approval gate
      strategy:
        runOnce:
          deploy:
            steps:
            - script: echo "Stage B done"

  # Simulate DeployProd - không cần approval
  - stage: StageC_NeedApproval
    displayName: "Stage C - No Approval"
    dependsOn: StageA
    jobs:
    - job: JobC
      steps:
      - script: echo "Stage C done"

  # ===== BUG: dependsOn cả B lẫn C =====
  # succeeded() sẽ check tất cả dependsOn → bị block vì B đang waiting

  - stage: StageD
    displayName: "Stage D - Bị Block"
    dependsOn:
      - StageB_NeedApproval   # ← thêm dòng này
      - StageC_NeedApproval
    condition: succeeded()    # check tất cả → block vì StageB waiting
    jobs:
    - job: JobD
      steps:
      - script: echo "Stage D done"

  - stage: StageE
    displayName: "Stage E - Bị Block"
    dependsOn:
      - StageB_NeedApproval   # ← thêm dòng này
      - StageC_NeedApproval
    condition: succeeded()    # check tất cả → block vì StageB waiting
    jobs:
    - job: JobE
      steps:
      - script: echo "Stage E done"