trigger:
- master

pool:
  name: Default

stages:
  - stage: DeployUat
    displayName: "Deploy UAT Stage"
    jobs:
      - job: DeployUatJob
        pool:
          name: Default
        steps:
          - script: echo "Deploying to UAT..."

  # Stage này dùng agentless job để giả lập "Waiting" 
  # → chiếm slot pipeline, block các stage sau
  - stage: DeployClusterK8S
    displayName: "Deploy Cluster K8S Stage"
    dependsOn: DeployUat
    jobs:
      - job: WaitApproval
        pool: server          # ← agentless, không dùng agent
        timeoutInMinutes: 60
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 60
            inputs:
              instructions: "Approve để tiếp tục Deploy K8S"
              onTimeout: reject

      - job: DeployK8SJob
        dependsOn: WaitApproval
        pool:
          name: Default
        steps:
          - script: echo "Deploying to K8S cluster..."

  # Chạy song song với DeployClusterK8S, dependsOn DeployUat
  - stage: DeployProd
    displayName: "Deploy Prod Stage"
    dependsOn: DeployUat
    jobs:
      - job: DeployProdJob
        pool:
          name: Default
        steps:
          - script: echo "Deploying to Prod..."
          - script: sleep 10   # giả lập thời gian deploy

  # BUG reproduced ở đây:
  # dependsOn DeployProd đã xong, nhưng vẫn bị Queued
  # vì DeployClusterK8S đang chiếm parallel job slot
  - stage: DeployClusterDR
    displayName: "Deploy DR Stage"
    dependsOn: DeployProd
    jobs:
      - job: DeployDRJob
        pool:
          name: Default
        steps:
          - script: echo "Deploying to DR..."

  - stage: SendNotify
    displayName: "Create PR Task"
    dependsOn: DeployProd
    jobs:
      - job: NotifyJob
        pool:
          name: Default
        steps:
          - script: echo "Sending notification..."