# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- master

pool:
  name: Default
  vmImage: ubuntu-latest

stages:
# Stage 1: Chạy bình thường
  - stage: StageA
    displayName: "Stage A"
    jobs:
    - job: JobA
      steps:
      - script: echo "Stage A done"

  # Simulate DeployClusterK8S - có approval gate trên environment prod
  - stage: StageB_NeedApproval
    displayName: "Stage B - Need Approval"
    dependsOn: StageA
    jobs:
    - deployment: DeployB
      environment: prod    # ← có approval gate, đang chờ
      strategy:
        runOnce:
          deploy:
            steps:
            - script: echo "Stage B done"

  # Simulate DeployProd - cũng dùng environment prod → bị queue sau StageB
  - stage: StageC_NoApproval
    displayName: "Stage C - No Approval"
    dependsOn: StageA
    jobs:
    - deployment: DeployC
      environment: prod    # ← cùng environment prod với StageB → bị lock
      strategy:
        runOnce:
          deploy:
            steps:
            - script: echo "Stage C done"

  # Chỉ dependsOn StageC nhưng vẫn bị block vì StageC chưa xong
  - stage: StageD
    displayName: "Stage D - Bị Block"
    dependsOn: StageC_NoApproval
    condition: succeeded()
    jobs:
    - job: JobD
      steps:
      - script: echo "Stage D done"

  - stage: StageE
    displayName: "Stage E - Bị Block"
    dependsOn: StageC_NoApproval
    condition: succeeded()
    jobs:
    - job: JobE
      steps:
      - script: echo "Stage E done"