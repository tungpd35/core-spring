# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- master

pool:
  name: Default
  vmImage: ubuntu-latest

stages:
- stage: Init
  displayName: "Init"
  jobs:
  - job: init
    steps:
    - script: echo "Init done"

# 2. Tách thành 2 nhánh song song
- stage: BuildA
  displayName: "Build A"
  dependsOn: Init
  jobs:
  - job: buildA
    steps:
    - script: echo "Build A done"

- stage: BuildB
  displayName: "Build B (WAITING)"
  dependsOn: Init
  jobs:
  - deployment: waitJob
    displayName: "Waiting Approval"
    environment: wait   # ⚠️ environment có approval → sẽ WAITING
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo "This will wait for approval"

# 3. Stage bạn kỳ vọng chạy được (nhưng sẽ bị pending)
- stage: FinalStage
  displayName: "Final Stage (Expected to run but will PENDING)"
  dependsOn: BuildA
  condition: succeeded()   # ⚠️ gây vấn đề
  jobs:
  - job: final
    steps:
    - script: echo "Final running"